<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALTA SYSTEM | 航空警報マップ</title><meta name="description" content="フライトシミュレーター向けの国別航空警報マップ。Restricted、Danger、Prohibitedを確認。"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"><script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script defer src="app.js"></script></head><body>
<header><div class="brand"><span class="brand-mark">◎</span><div>ALTA <b>SYSTEM</b><small>FLIGHT SIMULATION / AIRSPACE EXPLORER</small></div></div><div class="header-right"><a id="mode-link" href="?demo=1">デモを見る</a><span id="mode" class="badge">読み込み中</span><a href="help.html">使い方</a><a href="guide.html">接続設定 ↗</a></div></header>
<nav id="tabs" aria-label="地域" class="region-tabs"><button data-region="all" aria-pressed="true">すべての地域</button><button data-region="Asia" aria-pressed="false">アジア</button><button data-region="Americas" aria-pressed="false">南北アメリカ</button><button data-region="Europe" aria-pressed="false">ヨーロッパ</button><button data-region="Oceania" aria-pressed="false">オセアニア</button><button data-region="Africa" aria-pressed="false">アフリカ</button></nav>
<main><aside><section class="intro"><span class="eyebrow">WORLD AIRSPACE</span><h1>空域を、見渡す。</h1><p>NOTAMの制限区域・演習警報を地図で確認</p></section><section class="filters"><label class="label" for="country">対象国</label><select id="country"><option value="all">選択した国すべて</option></select><label class="label" for="search">警報を検索</label><input id="search" type="search" placeholder="区域名・識別子・Qコード"><div class="filter-title">表示レイヤー</div><label class="toggle"><span><i class="swatch"></i>Restricted <small>制限</small></span><input type="checkbox" data-kind="Restricted" checked></label><label class="toggle"><span><i class="swatch"></i>Danger <small>危険</small></span><input type="checkbox" data-kind="Danger" checked></label><label class="toggle"><span><i class="swatch"></i>Prohibited <small>禁止</small></span><input type="checkbox" data-kind="Prohibited" checked></label><label class="toggle envelope"><span>Q行の概略円を含める</span><input id="approx" type="checkbox" checked></label></section><section class="results"><h2>表示中の区域 <span id="count">—</span></h2><div id="areas"><p>データを読み込み中…</p></div></section><section class="unplotted"><details><summary id="unplotted-count">未描画の警報 0件</summary><div id="unplotted-list"></div></details></section></aside>
<section class="map-shell" aria-label="航空警報地図"><div id="map"></div><div class="map-title"><span class="eyebrow">AIRSPACE OVERVIEW</span><strong id="map-title">世界の航空警報</strong></div><div id="notice" role="status" class="notice">接続を確認しています</div><div class="map-legend"><span><i></i>提供された境界</span><span><i class="dashed"></i>Q行の概略範囲</span></div><button id="fit" class="map-fit">表示区域に合わせる</button></section></main>
<footer><div><span class="eyebrow">REFRESH</span><strong>30 min</strong><span id="updated">未取得</span></div><button id="refresh">↻ 今すぐ再読込</button></footer><div class="disclaimer">シミュレーター・研究用途。実運航には使用できません。区域の存在は現在の有効化を意味しません。時刻・高度・運用条件を確認してください。</div>
</body></html>

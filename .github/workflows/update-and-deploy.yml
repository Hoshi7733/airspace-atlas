name: Update airspace and deploy websites
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['state/**', 'web/data/**', 'web/staging/**', 'web/production/**', 'web/demo/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: airspace-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test geometry and filtering
        run: python -m unittest discover -s tests -v
      - name: Build separate fictional demo
        run: python scripts/update_airspace.py --demo --output web/demo
      - name: Sync FAA worldwide classifications and changes
        env:
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
        run: |
          python scripts/sync_global.py --report /tmp/airspace-errors
      - name: Commit compact country snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/production web/demo state
          if ! git diff --cached --quiet; then
            git commit -m 'Update airspace snapshots [skip ci]'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not trigger another workflow. Deploy in this same run.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
          retention-days: 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check Cloudflare configuration
        id: cloudflare_config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment pending: add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to repository Secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare Cloudflare Direct Upload project
        if: steps.cloudflare_config.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/prepare_cloudflare.py
      - name: Publish website and current JSON to Cloudflare Pages
        if: steps.cloudflare_config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=alta-system --branch=main
      - name: Report partial source failures after publishing stale status
        shell: bash
        run: |
          count=$(cat /tmp/airspace-errors)
          if [ "$count" -gt 0 ]; then
            echo "::error::$count country source(s) failed; previous valid data and failure status were published."
            exit 1
          fi
